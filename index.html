<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>AI社員 読取専用 OAuth の戻り先</title>
<style>
  body { font-family: -apple-system, "Hiragino Sans", sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.7; color: #1d1d1f; background: #fff; }
  h1 { font-size: 1.25rem; } li { margin: .4rem 0; } .no { color: #b00020; font-weight: 600; }
</style>
</head>
<body>
<h1>AI社員（3 アカウント・読取専用）の OAuth の戻り先</h1>
<p>このページは何も送信しません（スクリプトなし・外部の読み込みなし）。</p>
<ol>
  <li>ブラウザの<strong>アドレス欄</strong>にある、このページのアドレス全体（<code>?code=…&amp;state=…</code> を含む）をコピーします。</li>
  <li>Mac のターミナルで実行中の <code>oauth-readonly.cjs finish</code> にだけ貼り付けて、Enter のあと Control-D を押します。</li>
  <li>貼り付けたら、このタブを閉じます。コードは 1 回だけ使え、数分で無効になります。</li>
</ol>
<p class="no">チャット・GitHub・メールには貼らないでください。</p>
</body>
</html>
